# Continuous integration: build the default Lake targets on every push and PR.
# Uses the official https://github.com/leanprover/lean-action (same stack as `lake new` templates).
# Feature branches used to need a manual "Run workflow" click because `push` only
# listed `main`. That made CI look broken. Run on every branch push.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lean toolchain + Lake build
        uses: leanprover/lean-action@v1
        with:
          # `auto-config` (default): run `lake build`; run `lake test` / `lake lint` only if configured.
          # Compile-time Mathlib linters still run during `lake build` via `weak.linter.mathlibStandardSet`.
          use-mathlib-cache: auto
