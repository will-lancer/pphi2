status:
  scope: >
    A mid-construction Lean 4 formalization of the P(Φ)₂ Euclidean QFT via the
    Glimm-Jaffe/Nelson lattice approach. The Osterwalder-Schrader axiom skeleton
    (OS0 analyticity, OS1 regularity, OS2 Euclidean invariance, OS3 reflection
    positivity, OS4 clustering, bundled as `Pphi2.SatisfiesFullOS`) is complete
    and the active source tree has 0 real sorries. The current working tree
    still needs a remote build before its default-target status is certified.
    The headline existence theorem
    `Pphi2.pphi2_existence` (∃ μ on S'(ℝ²) satisfying all five OS axioms) is
    assembled from the lattice construction + continuum limit, but is CONDITIONAL
    on a set of named analytic axioms (uniform exponential moment bounds,
    clustering-from-spectral-gap, rotation/Ward-identity restoration,
    propagator convergence, non-Gaussianity). (The former uniform-spectral-gap
    axioms were removed 2026-07-12 as false-as-stated; see AXIOM_AUDIT.md.) These represent the standard but
    not-yet-formalized analytic hard cores of the construction. The build target
    is the `Pphi2` library (with `Common`); the legacy `ddj/` directory and the
    parked `future/CylinderContinuumLimit/` directory are NOT in the build and
    contain their own separate axioms/sorries that do not affect the main results.
  sorry_count: 0                 # source scan in Pphi2/ + Common; remote build pending
  sorry_in_definitions: 0
  axioms:                        # 25 source-level declarations in Pphi2/ (23 public + 2 private); remote certificate pending
    - schwinger_agreement                                  # Bridge.lean
    - os2_from_phi4                                        # Bridge.lean
    - pphi2_nontriviality                                  # Main.lean:158 (restated about-the-limit 2026-07-13)
    - continuum_exponential_moment_bound                   # ContinuumLimit/AxiomInheritance.lean:124
    - canonical_continuumMeasure_cf_tendsto                # ContinuumLimit/AxiomInheritance.lean:328
    - continuum_exponential_clustering                     # ContinuumLimit/AxiomInheritance.lean:355
    - continuumLimit_nonGaussian                           # ContinuumLimit/Convergence.lean:307 (regime-restricted 2026-07-13)
    - pphi2_limit_exists                                   # ContinuumLimit/Convergence.lean:346 (open coupled-limit existence input)
    - fss_infrared_quadratic                               # AsymTorus/AsymInfraredBound.lean:121
    - asymTransferGap_uniform_fixedLs                      # AsymTorus/AsymSliceFamilySusceptibility.lean:913
    - asymFinitePeriodicBridge_remainder_bound_uniform     # AsymTorus/AsymSliceFamilySusceptibility.lean:998
    - asymFinitePeriodicBridge_diagonal_bound              # AsymTorus/AsymSliceFamilySusceptibility.lean:1024
    - asymInteracting_expMoment_volume_uniform             # AsymTorus/AsymContinuumLimit.lean:2704 (legacy monolithic input)
    - asymInteracting_mgf_gaussianDominated                # AsymTorus/AsymExpMomentDischarge.lean:122
    - asymInteractingVariance_le_freeVariance_lattice_Lt_uniform # AsymTorus/AsymExpMomentDischarge.lean:219
    - asymPartition_ground_bound                           # AsymTorus/AsymBridgeInstance.lean:271
    - asymFinitePeriodicBridge_remainder_bound             # AsymTorus/AsymBridgeInstance.lean:293
    - groundVariance_le_freeCovariance                     # AsymTorus/AsymB5bSingleSlice.lean:200
    - asymTorusInteracting_exponentialMomentBound          # AsymTorus/AsymTorusOS.lean:852 (private)
    - rotation_cf_defect_polylog_bound                     # OSProofs/OS2_WardIdentity.lean:619
    - two_point_clustering_from_spectral_gap               # OSProofs/OS4_MassGap.lean:136
    - general_clustering_from_spectral_gap                 # OSProofs/OS4_MassGap.lean:159
    - gaussian_rp_cov_perfect_square                       # OSProofs/OS3_RP_Lattice.lean:660 (private)
    - nelson_exponential_estimate_master_bounded           # NelsonEstimate/PolynomialChaosBridge.lean:1329
    - latticeGreenBilinear_basis_tendsto_continuum         # GaussianContinuumLimit/PropagatorConvergence.lean:119
  main_results:
    - declaration: "Pphi2.pphi2_existence"
      file: "Pphi2/Main.lean"
      sorry_count: 0
      literature_dependencies:
        - statement: "existence of a probability measure on S'(ℝ²) satisfying the OS0–OS4 axioms for P(Φ)₂; conditional on the single OPEN existence axiom `pphi2_limit_exists` (Fröhlich 1976 / Park 1977 tightness route; δ₀ vacuity of the limit predicate closed 2026-07-13) plus the 4 named OS-inheritance axioms (the former uniform-spectral-gap axioms were removed 2026-07-12 as false as stated)"
          source: "ISBN:978-0-691-08144-3"
        - statement: "lattice construction and continuum limit of the P(Φ)₂ measure"
          source: "ISBN:978-0-387-96477-7"
    - declaration: "Pphi2.pphi2_main"
      file: "Pphi2/Main.lean"
      sorry_count: 0
      literature_dependencies:
