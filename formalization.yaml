# formalization.yaml — https://github.com/mathlib-initiative/formalization.yaml (v0.3)
# Describes the post-Phase-4.1 (honest ℝ² headline, 2026-07-13) state of pphi2.
# Source tree (Pphi2.lean + Common): 0 sorries, 25 `axiom` declarations
#   (23 public + 2 private). Remote build and kernel-certificate refresh pending.
#   Legacy `ddj/` and parked `future/` are NOT part of the default build target.
