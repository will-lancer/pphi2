# formalization.yaml — https://github.com/mathlib-initiative/formalization.yaml (v0.3)
# Describes the post-Phase-4.1 (honest ℝ² headline, 2026-07-13) state of pphi2.
# Source tree (Pphi2.lean + Common): 0 sorries, 27 `axiom` declarations
#   (25 public + 2 private). The 9-target headline report was generated at commit
#   7f7b73876704dab85431573bb4ff0373e79bc602 and verified at
#   dd86add0a569ed353d3de799f0f7140a5bd0ed56.
#   Legacy `ddj/` and parked `future/` are NOT part of the default build target.
