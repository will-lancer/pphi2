status:
  scope: >
    A mid-construction Lean 4 formalization of the P(Φ)₂ Euclidean QFT via the
    Glimm-Jaffe/Nelson lattice approach. The Osterwalder-Schrader axiom skeleton
    (OS0 analyticity, OS1 regularity, OS2 Euclidean invariance, OS3 reflection
    positivity, OS4 clustering, bundled as `Pphi2.SatisfiesFullOS`) is complete
    and the active source tree has 0 sorries. The checked-in 9-target
    kernel report was generated at proof-repair commit
    `7f7b73876704dab85431573bb4ff0373e79bc602`; the fork-side remote
    `lake build` was commit `dd86add0a569ed353d3de799f0f7140a5bd0ed56`.
    Re-run GitHub Actions on a PR against `mrdouglasny/pphi2` for a
    Douglas-side certificate. The headline existence theorem
    `Pphi2.pphi2_existence` (∃ μ on S'(ℝ²) satisfying all five OS axioms) is
    assembled from the lattice construction + continuum limit, but is CONDITIONAL
    on exactly five named project axioms:
    `canonical_continuumMeasure_cf_tendsto`,
    `continuum_exponential_clustering`,
    `continuum_exponential_moment_bound`, `pphi2_limit_exists`, and
    `rotation_cf_defect_polylog_bound`. Propagator convergence and
    non-Gaussianity belong to separate results. (The former uniform-spectral-gap
    axioms were removed 2026-07-12 as false-as-stated; see AXIOM_AUDIT.md.) These represent the standard but
    not-yet-formalized analytic hard cores of the construction. The build target
    is the `Pphi2` library (with `Common`); the legacy `ddj/` directory and the
    parked `future/CylinderContinuumLimit/` directory are NOT in the build and
    contain their own separate axioms/sorries that do not affect the main results.
  sorry_count: 0                 # source scan in Pphi2/ + Common; remote build passed
  sorry_in_definitions: 0
  axioms:                        # 27 source declarations in Pphi2/ (25 public + 2 private)
    - schwinger_agreement                                  # Bridge.lean
    - os2_from_phi4                                        # Bridge.lean
    - pphi2_nontriviality                                  # Main.lean:156 (restated about-the-limit 2026-07-13)
    - continuum_exponential_moment_bound                   # ContinuumLimit/AxiomInheritance.lean:124
    - canonical_continuumMeasure_cf_tendsto                # ContinuumLimit/AxiomInheritance.lean:328
    - continuum_exponential_clustering                     # ContinuumLimit/AxiomInheritance.lean:355
    - continuumLimit_nonGaussian                           # ContinuumLimit/Convergence.lean:310 (regime-restricted 2026-07-13)
    - pphi2_limit_exists                                   # ContinuumLimit/Convergence.lean:342 (NEW 2026-07-13, the OPEN existence input)
    - fss_infrared_quadratic                               # AsymTorus/AsymInfraredBound.lean:117
    - asymTransferGap_uniform_fixedLs                      # AsymTorus/AsymSliceFamilySusceptibility.lean:887
    - asymFinitePeriodicBridge_remainder_bound_uniform     # AsymTorus/AsymSliceFamilySusceptibility.lean:972
    - asymFinitePeriodicBridge_diagonal_bound              # AsymTorus/AsymSliceFamilySusceptibility.lean:998
    - asymInteracting_expMoment_volume_uniform             # AsymTorus/AsymContinuumLimit.lean:2460
    - asymInteracting_mgf_gaussianDominated                # AsymTorus/AsymExpMomentDischarge.lean:114
    - asymInteractingVariance_le_freeVariance_lattice_Lt_uniform # AsymTorus/AsymExpMomentDischarge.lean:211
    - asymGroundStateRep_pos_ae                            # AsymTorus/AsymBridgeInstance.lean:81
    - asymPartition_ground_bound                           # AsymTorus/AsymBridgeInstance.lean:251
    - asymFinitePeriodicBridge_remainder_bound             # AsymTorus/AsymBridgeInstance.lean:273
    - asymGroundSemigroup_intertwines                      # AsymTorus/AsymBridgeInstance.lean:318
    - groundVariance_le_freeCovariance                     # AsymTorus/AsymB5bSingleSlice.lean:162
    - asymTorusInteracting_exponentialMomentBound          # AsymTorus/AsymTorusOS.lean:852 (private)
    - rotation_cf_defect_polylog_bound                     # OSProofs/OS2_WardIdentity.lean:614
    - two_point_clustering_from_spectral_gap               # OSProofs/OS4_MassGap.lean:136
    - general_clustering_from_spectral_gap                 # OSProofs/OS4_MassGap.lean:159
    - gaussian_rp_cov_perfect_square                       # OSProofs/OS3_RP_Lattice.lean:648 (private)
    - nelson_exponential_estimate_master_bounded           # NelsonEstimate/PolynomialChaosBridge.lean:1321
    - latticeGreenBilinear_basis_tendsto_continuum         # GaussianContinuumLimit/PropagatorConvergence.lean:103
  main_results:
    - declaration: "Pphi2.pphi2_existence"
      file: "Pphi2/Main.lean"
      sorry_count: 0
      literature_dependencies:
        - statement: "existence of a probability measure on S'(ℝ²) satisfying the OS0–OS4 axioms for P(Φ)₂; conditional on exactly five named project axioms: `canonical_continuumMeasure_cf_tendsto`, `continuum_exponential_clustering`, `continuum_exponential_moment_bound`, `pphi2_limit_exists`, and `rotation_cf_defect_polylog_bound`. Here `pphi2_limit_exists` is the single OPEN existence input (Fröhlich 1976 / Park 1977 tightness route; δ₀ vacuity of the limit predicate closed 2026-07-13). Propagator convergence and non-Gaussianity belong to separate results."
          source: "ISBN:978-0-691-08144-3"
        - statement: "lattice construction and continuum limit of the P(Φ)₂ measure"
          source: "ISBN:978-0-387-96477-7"
    - declaration: "Pphi2.pphi2_main"
      file: "Pphi2/Main.lean"
      sorry_count: 0
      literature_dependencies:
