          source: "ISBN:978-0-691-08144-3"
    - declaration: "Pphi2.pphi2_nontrivial"
      file: "Pphi2/Main.lean"
      sorry_count: 0
      literature_dependencies:
        - statement: "nontriviality of the two-point function S₂(f,f) > 0 (rests on the `pphi2_nontriviality` axiom — restated 2026-07-13 about the coupled limit — packaged via `pphi2_limit_exists`; correlation-inequality lower bound)"
          source: "10.2307/1970988"
    - declaration: "Pphi2.cylinderIso_OS_of_RP_OS2"
      file: "Pphi2/AsymTorus/AsymContinuumLimit.lean"
      sorry_count: 0
      literature_dependencies:
        - statement: "quartic-only cylinder S¹(Lₛ)×ℝ φ⁴₂ OS0–OS3 assembly with arguments `(P) (hP : P.n = 4) (mass) (hmass)`; OS2 and reflection positivity are proved internally; the footprint beyond the Lean trio is the upstream axiom `GaussianField.embed_l2_uniform_bound` and the Pphi2 axiom `Pphi2.asymInteracting_expMoment_volume_uniform`"
          source: "ISBN:978-0-387-96477-7"

